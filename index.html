<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date Access</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="card">
      <div id="passwordSection">
        <h1>Locked</h1>
        <p class="subtitle">Enter the password to continue</p>
        <form id="passwordForm">
          <label for="passwordInput">Password</label>
          <input id="passwordInput" type="05202026" placeholder="Enter password" required />
          <button type="submit">Unlock</button>
          <div id="passwordMessage" class="message" aria-live="polite"></div>
        </form>
      </div>

      <div id="dateSection" class="hidden">
        <h1>Select a date</h1>
        <p class="subtitle">You did great love!!</p>
        <form id="dateForm">
          <label for="dateInput">Choose a date</label>
          <input id="dateInput" type="date" required />
          <button type="submit">Submit date</button>
        </form>
        <div id="dateResult" class="date-result hidden"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
